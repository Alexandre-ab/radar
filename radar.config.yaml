# Plan de veille RADAR : tout ce que l'outil surveille est écrit ici, nulle part ailleurs.
axes:      [cli-ia, securite, cgu-ia]          # 3 à 5 thèmes, au moins 3 types de veille
# « &sujets » donne un nom à cette liste, réutilisée plus bas avec « *sujets » (règles de score).
mots_cles: &sujets ["claude code", "codex", "MCP", "express", "sqlite", "better-sqlite3"]  # ce qui déclenche une capture
ignorer:   ["crypto", "NFT"]                   # ce qu'on décide de ne PAS surveiller
sources:                                        # au moins 5, de 3 types différents
  # Pour toutes les sources :
  #   nom         = ce qui s'affiche dans le champ « source » de la fiche (obligatoire)
  #   categorie   = officielle, institution, communaute ou social (obligatoire)
  #   type_veille = technologique, concurrentielle, reglementaire ou securite (obligatoire)
  #                 deux sources de même nom doivent avoir la même categorie et le même type_veille
  #   limite      = nombre d'infos récupérées à chaque collecte (1 à 100, 10 par défaut)
  # releases   : depot (GitHub), produit = début du titre (« Claude Code v2.1.312 »)
  # hackernews : requete = la recherche envoyée à Hacker News
  # failles    : paquet, ecosysteme (npm, PyPI…), version (entre guillemets, facultative)
  # page       : url de la page suivie ; une fiche par nouvelle version de son texte
  - { type: releases, depot: anthropics/claude-code, nom: "Dépôt GitHub officiel", categorie: officielle, produit: "Claude Code", limite: 10, type_veille: technologique }
  - { type: releases, depot: openai/codex, nom: "Dépôt GitHub officiel", categorie: officielle, produit: "Codex CLI", limite: 10, type_veille: technologique }
  - { type: hackernews, requete: "claude code", nom: "Hacker News", categorie: communaute, limite: 20, type_veille: technologique }
  # OSV : base de référence des failles, tenue par l'OpenSSF, hors éditeur → institution
  - { type: failles, paquet: express, ecosysteme: npm, version: "4.17.1", nom: "Base OSV (failles connues)", categorie: institution, limite: 10, type_veille: securite }
  - { type: page, url: "https://www.anthropic.com/legal/aup", nom: "Anthropic · Usage Policy", categorie: officielle, type_veille: reglementaire }
  # Brique 5 (question A · la mémoire) : l'alternative SQLite
  - { type: releases, depot: WiseLibs/better-sqlite3, nom: "Dépôt GitHub officiel", categorie: officielle, produit: "better-sqlite3", limite: 10, type_veille: technologique }
  - { type: failles, paquet: better-sqlite3, ecosysteme: npm, nom: "Base OSV (failles connues)", categorie: institution, limite: 10, type_veille: securite }
  - { type: hackernews, requete: "sqlite markdown", nom: "Hacker News", categorie: communaute, limite: 20, type_veille: technologique }
frequence: { failles: quotidien, tendances: hebdo }
livrable:  "top 10 du lundi + alerte si faille"

# Brique 3 : comment « radar score » calcule la fiabilité de chaque info.
# Chaque règle s'appuie sur ce que contient la fiche : source, catégorie, url, titre, date.
# Une règle donne ses points si UN de ses cas (lignes « - ») est vrai ;
# un cas est vrai si TOUTES ses conditions le sont. Conditions possibles :
#   sources        : la source de l'info (champ « source ») est l'une de celles-ci
#   categories     : la catégorie de sa source est l'une de celles-ci
#   domaines       : le domaine de l'url (« github.com » couvre aussi « www.github.com »)
#   url_contient   : l'url contient l'un de ces textes
#   titre_contient : le titre contient l'un de ces textes
#   titre_sans     : le titre ne contient AUCUN de ces textes
# Majuscules et minuscules sont confondues. « libelle » = ce qui est lu à l'oral.
regles_score:
  categorie: { officielle: 3, institution: 2, communaute: 1, social: 0 }

  fraicheur: { libelle: "récente", jours: 183, points: 1 }      # moins de 6 mois

  auteur_identifie:
    libelle: "auteur identifié"
    points: 1
    si:
      - sources: ["Dépôt GitHub officiel", "Anthropic · Usage Policy", "Base OSV (failles connues)"]
      - domaines: ["github.com"]          # le propriétaire du dépôt est nommé dans l'url

  source_ou_methode_citee:
    libelle: "source ou méthode citée"
    points: 1
    si:
      - sources: ["Base OSV (failles connues)"]   # chaque faille cite son CVE et ses références
      - domaines: ["arxiv.org"]
      - titre_contient: ["paper", "study", "étude", "postmortem", "analysis"]

  recoupee:
    libelle: "recoupée"
    points: 1
    sujets: *sujets      # un même sujet dans le titre d'une info venant d'une AUTRE source

  biais_interet:
    libelle: "biais d'intérêt"
    points: -2
    si:
      - titre_contient: ["Show HN", "sponsored", "sponsorisé", "partner", "partenaire"]  # l'auteur présente son produit
      - url_contient: ["utm_", "?ref=", "&ref=", "affiliate", "/aff/"]                 # lien affilié ou traqué

  # --- Nos règles à nous : d'autres biais ---
  effet_de_mode:
    libelle: "effet de mode"
    points: -1
    si:
      - titre_contient: ["here's what", "here's why", "game changer", "game-changer", "changes everything", "is dead", "10x", "you won't believe"]
      - { categories: [communaute, social], titre_sans: *sujets }   # le sujet n'est que dans le texte : l'info surfe sur la tendance

  contenu_genere:
    libelle: "contenu généré par IA"
    points: -1
    si:
      - titre_contient: ["written by claude", "written by ai", "generated by", "généré par", "100% ai"]

  benchmark_editeur:
    libelle: "comparatif d'éditeur"
    points: -1
    si:
      - titre_contient: ["better than", "faster than", "than codex", "than claude", "outperform", "beats ", "benchmark"]

  version_de_test:
    libelle: "version de test"
    points: -1
    si:
      - titre_contient: ["alpha", "beta", "-rc"]   # pré-versions : on préfère les versions stables

# Brique 4 : « radar score » marque « retenue » une info dont la fiabilité atteint ce seuil,
# sinon « ecartee ».
seuil: 4

# Brique 4 : les étiquettes que « radar collect » et « radar score » peuvent poser sur une info.
# Seules celles-ci existent. Une étiquette est posée si UN de ses cas est vrai ; mêmes
# conditions que dans regles_score, plus « types_veille » (le type de veille de l'info).
etiquettes:
  cli-ia:
    si:
      - titre_contient: ["claude code", "codex", "coding agent", "harness", "cli "]
  claude-code:
    si:
      - titre_contient: ["claude code"]
  codex:
    si:
      - titre_contient: ["codex"]
  mcp:
    si:
      - titre_contient: ["MCP", "model context protocol"]
  securite:
    si:
      - types_veille: [securite]
      - titre_contient: ["vulnerab", "faille", "security", "sécurité", "credential", "leak", "XSS", "CVE"]
  cgu-ia:
    si:
      - types_veille: [reglementaire]
      - titre_contient: ["terms of service", "usage policy", "conditions d'utilisation", "CGU"]
  data:
    si:
      - titre_contient: ["data", "données", "telemetry", "télémétrie", "privacy", "database", "schema", "hashes",
                         "sqlite", "better-sqlite3", "markdown"]

# Brique 5 : « radar decide » compare 2 options et écrit decision.md.
# Les poids (1 à 3) et les notes (1 à 5) sont les NÔTRES : chaque note cite son chiffre
# et l'url de sa source, avec la date où nous l'avons consultée.
# Une option dont la note sur un critère est ≤ « note_eliminatoire » est éliminée.
decision:
  question: "A · La mémoire d'Hivemind reste-t-elle en fichiers .md, ou passe-t-on à SQLite ?"
  contexte: "Hivemind garde aujourd'hui sa mémoire dans des fichiers .md. L'alternative étudiée est une base SQLite locale, via la bibliothèque better-sqlite3."
  besoins:              # les besoins du client, qui fixent nos poids
    - "Hivemind reste local"
    - "0 € d'abonnement en plus"
    - "1 seul développeur"
    - "prochaine livraison dans 2 sprints"
  commits_sur_jours: 90  # fenêtre du chiffre « commits récents » relevé par gh api
  infos_max: 15          # nombre maximum d'infos de veille citées dans decision.md
  filtre:                # les infos de data/items.json qui touchent la question
    si:
      - titre_contient: ["sqlite", "markdown", "better-sqlite3", "database", "memory", "mémoire", "local-first", "context store"]
  options:
    fichiers_md:
      nom: "Garder les fichiers .md (statu quo)"
      depot: "Alexandre-ab/radar"
      impact:
        perimetre: "Aucun changement de code : la mémoire reste dans les fichiers .md."
        budget: "0 € : aucune dépendance ni abonnement ajouté."
        delais: "0 sprint : rien à migrer, les 2 sprints restent pour les fonctionnalités."
        anticipation: "Si la mémoire grossit, prévoir un index de recherche sur les fichiers avant de changer de stockage."
    sqlite:
      nom: "Passer à SQLite local (better-sqlite3)"
      depot: "WiseLibs/better-sqlite3"
      impact:
        perimetre: "Réécrire la couche de stockage et un script de migration des fichiers .md vers la base."
        budget: "0 € de licence (MIT) ; le coût est le temps du seul développeur."
        delais: "Estimation à valider : au moins 1 des 2 sprints pour la migration et ses tests."
        anticipation: "Recherches plus rapides si la mémoire grossit ; suivre les versions de Node.js (≥ 22 exigé)."
  criteres:
    maturite:
      libelle: "Maturité"
      poids: 2
      notes:
        fichiers_md: { note: 3, chiffre: "Dépôt créé le 2026-10-28, 0 release GitHub ; stockage en fichiers texte sans bibliothèque", source: "https://github.com/Alexandre-ab/radar", date: "2026-10-28" }
        sqlite:      { note: 5, chiffre: "Créé le 2016-09-07, 130 releases, dernière v13.0.3 du 2026-08-05", source: "https://github.com/WiseLibs/better-sqlite3/releases", date: "2026-10-28" }
    dynamisme:
      libelle: "Dynamisme"
      poids: 1            # peu décisif pour une livraison dans 2 sprints
      notes:
        fichiers_md: { note: 2, chiffre: "6 commits sur 90 jours, 1 contributeur", source: "https://github.com/Alexandre-ab/radar/commits/main", date: "2026-10-28" }
        sqlite:      { note: 3, chiffre: "3 commits sur 90 jours, mais 69 contributeurs et 7 531 étoiles", source: "https://github.com/WiseLibs/better-sqlite3", date: "2026-10-28" }
    licence:
      libelle: "Licence"
      poids: 3            # 0 € d'abonnement en plus : une licence payante ou incompatible élimine l'option
      note_eliminatoire: 1
      notes:
        fichiers_md: { note: 5, chiffre: "Aucune bibliothèque tierce ajoutée ; dépôt sans licence déclarée (license: null), code de l'équipe", source: "https://github.com/Alexandre-ab/radar", date: "2026-10-28" }
        sqlite:      { note: 5, chiffre: "Licence MIT : usage libre et gratuit", source: "https://github.com/WiseLibs/better-sqlite3/blob/master/LICENSE", date: "2026-10-28" }
    maintenance:
      libelle: "Maintenance"
      poids: 2
      notes:
        fichiers_md: { note: 3, chiffre: "1 seul contributeur : toute la maintenance repose sur l'équipe", source: "https://github.com/Alexandre-ab/radar", date: "2026-10-28" }
        sqlite:      { note: 4, chiffre: "Dernier push le 2026-08-10, 76 issues ouvertes, 0 faille connue dans la base OSV (npm)", source: "https://osv.dev/list?q=better-sqlite3&ecosystem=npm", date: "2026-10-28" }
    cout_total:
      libelle: "Coût total"
      poids: 3            # 0 € en plus et 1 seul développeur
      notes:
        fichiers_md: { note: 5, chiffre: "0 € et 0 migration : rien à changer", source: "https://github.com/Alexandre-ab/radar", date: "2026-10-28" }
        sqlite:      { note: 3, chiffre: "0 € de licence, mais Node.js ≥ 22 et un module natif (node-addon-api) exigés, plus une migration à écrire", source: "https://github.com/WiseLibs/better-sqlite3/blob/master/package.json", date: "2026-10-28" }
    apprentissage:
      libelle: "Apprentissage"
      poids: 3            # 1 seul développeur, livraison dans 2 sprints
      notes:
        fichiers_md: { note: 5, chiffre: "Rien à apprendre : lecture et écriture de fichiers texte", source: "https://github.com/Alexandre-ab/radar", date: "2026-10-28" }
        sqlite:      { note: 3, chiffre: "API synchrone documentée (docs/api.md), mais SQL et schéma de base à concevoir", source: "https://github.com/WiseLibs/better-sqlite3/blob/master/docs/api.md", date: "2026-10-28" }
    reversibilite:
      libelle: "Réversibilité"
      poids: 2
      notes:
        fichiers_md: { note: 5, chiffre: "Fichiers .md lisibles et versionnés dans git : aucun verrou", source: "https://github.com/Alexandre-ab/radar", date: "2026-10-28" }
        sqlite:      { note: 3, chiffre: "La base tient dans un fichier local, mais revenir aux .md demande un export à écrire ; module natif à recompiler (docs/compilation.md)", source: "https://github.com/WiseLibs/better-sqlite3/blob/master/docs/compilation.md", date: "2026-10-28" }
