# Plan de veille RADAR : tout ce que l'outil surveille est écrit ici, nulle part ailleurs.
axes:      [cli-ia, securite, cgu-ia]          # 3 à 5 thèmes, au moins 3 types de veille
mots_cles: ["claude code", "codex", "MCP", "express"]  # ce qui déclenche une capture
ignorer:   ["crypto", "NFT"]                   # ce qu'on décide de ne PAS surveiller
sources:                                        # au moins 5, de 3 types différents
  # Pour toutes les sources :
  #   nom         = ce qui s'affiche dans le champ « source » de la fiche (obligatoire)
  #   type_veille = technologique, concurrentielle, reglementaire ou securite
  #   limite      = nombre d'infos récupérées à chaque collecte (1 à 100, 10 par défaut)
  # releases   : depot (GitHub), produit = début du titre (« Claude Code v2.1.312 »)
  # hackernews : requete = la recherche envoyée à Hacker News
  # failles    : paquet, ecosysteme (npm, PyPI…), version (entre guillemets, facultative)
  # page       : url de la page suivie ; une fiche par nouvelle version de son texte
  - { type: releases, depot: anthropics/claude-code, nom: "Dépôt GitHub officiel", produit: "Claude Code", limite: 10, type_veille: technologique }
  - { type: releases, depot: openai/codex, nom: "Dépôt GitHub officiel", produit: "Codex CLI", limite: 10, type_veille: technologique }
  - { type: hackernews, requete: "claude code", nom: "Hacker News", limite: 20, type_veille: technologique }
  - { type: failles, paquet: express, ecosysteme: npm, version: "4.17.1", nom: "Base OSV (failles connues)", limite: 10, type_veille: securite }
  - { type: page, url: "https://www.anthropic.com/legal/aup", nom: "Anthropic · Usage Policy", type_veille: reglementaire }
frequence: { failles: quotidien, tendances: hebdo }
livrable:  "top 10 du lundi + alerte si faille"
